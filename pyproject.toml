[project]
name = "flowscout"
version = "0.1.0"
description = "LLM-free automated web path exploration framework"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "playwright~=1.49.0",
  "pydantic~=2.10.0",
  "networkx~=3.4.0",
  "rich~=13.9.0",
  "click~=8.1.0",
  "jinja2~=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "pytest-httpserver>=1.1.0",
]

[project.scripts]
flowscout = "flowscout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowscout"]

[tool.bandit]
skips = ["B101"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
