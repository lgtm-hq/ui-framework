---
name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

jobs:
  quality:
    permissions:
      contents: read
      packages: read # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@39514a688ee00cdc2a82cdd13310ee1ee36b84c2 # v0.85.0
    with:
      egress-policy: block
      tooling-ref: '39514a688ee00cdc2a82cdd13310ee1ee36b84c2' # v0.85.0
      job-name: '🛠️ Lintro Code Quality'
