---
name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

jobs:
  quality:
    permissions:
      contents: read
      packages: read # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@cda8cb5ae9dc69b82f396ac468c7a091a65f8568 # v0.82.4
    with:
      egress-policy: block
      tooling-ref: 'cda8cb5ae9dc69b82f396ac468c7a091a65f8568' # v0.82.4
      job-name: '🛠️ Lintro Code Quality'
