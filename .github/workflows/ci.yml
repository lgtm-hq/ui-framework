---
name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

jobs:
  quality:
    permissions:
      contents: read
      packages: read # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@c40cd60334b5b5f2952e1af99e2e083be50c1620 # v0.80.0
    with:
      egress-policy: block
      tooling-ref: 'c40cd60334b5b5f2952e1af99e2e083be50c1620' # v0.80.0
      job-name: '🛠️ Lintro Code Quality'
