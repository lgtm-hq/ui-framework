---
name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

jobs:
  quality:
    permissions:
      contents: read
      packages: read # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@8a48e818c43efe4ac3b2669b2be31bee0b99cb15 # v0.98.7
    with:
      egress-policy: block
      tooling-ref: '8a48e818c43efe4ac3b2669b2be31bee0b99cb15' # v0.98.7
      job-name: '🛠️ Lintro Code Quality'
