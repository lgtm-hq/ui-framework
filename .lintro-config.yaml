# ui-framework lintro configuration.
# JS/TS sources are gated by Biome and the frontend toolchain; lintro covers
# the cross-language checks. No first-party Python lives here — the only
# pylint-visible files are vendored lgtm-ci tooling scripts, whose catalogue
# is gated upstream in lgtm-ci's own repo.
tools:
  pylint:
    enabled: false
